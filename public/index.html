<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Texas Hold'em Party</title>
<script src="/socket.io/socket.io.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<style>
:root{color-scheme:dark}body{font-family:Inter,ui-sans-serif,system-ui;background:#09090b;color:#f4f4f5}
.table-felt{background:radial-gradient(ellipse at center,#166534 0%,#14532d 54%,#052e16 100%);border:10px solid #713f12;box-shadow:inset 0 0 0 3px #a16207,0 18px 50px #0008}
.playing-pulse{animation:pulse 1.1s infinite}@keyframes pulse{0%,100%{box-shadow:0 0 0 0 #fbbf2466}50%{box-shadow:0 0 0 9px #fbbf2400}}
.card{width:clamp(42px,6vw,72px);height:clamp(62px,8vw,100px);border-radius:8px;background:#fafafa;color:#18181b;display:flex;flex-direction:column;justify-content:space-between;padding:5px;font-weight:800;box-shadow:0 3px 7px #0006; flex-shrink:0}
.card.red{color:#dc2626}.card.back{background:repeating-linear-gradient(45deg,#1e3a8a,#1e3a8a 5px,#dbeafe 5px,#dbeafe 7px);border:4px solid white}
.seat{min-width:110px;background:#18181be8;border:1px solid #52525b;border-radius:14px;padding:10px;text-align:center}
.btn{min-height:48px;border-radius:12px;padding:10px 15px;font-weight:800}
input,select{color:#18181b}
</style>
</head>
<body class="min-h-screen">
<header class="border-b border-zinc-800 px-4 py-3 flex items-center justify-between gap-3">
 <div><div class="font-black tracking-wide text-lg sm:text-xl">♠ TEXAS HOLD’EM</div><div class="text-xs text-zinc-400">TV host · Phone controllers</div></div>
 <div id="connection" class="text-xs text-amber-300">Connecting…</div>
</header>
<main class="max-w-6xl mx-auto p-3 sm:p-6">
<section id="setup" class="max-w-xl mx-auto bg-zinc-900 border border-zinc-800 rounded-2xl p-5 sm:p-7 mt-5">
 <h1 class="text-2xl font-black mb-2">Join the table</h1><p class="text-zinc-400 mb-5">Create a table on the TV, then join from each player's phone.</p>
 <label class="block text-sm text-zinc-300 mb-1" for="name">Your player name</label><input id="name" maxlength="18" class="w-full rounded-xl p-3 mb-4" placeholder="e.g. Shaun">
 <div class="grid sm:grid-cols-2 gap-3">
  <button id="hostBtn" class="btn bg-emerald-700 hover:bg-emerald-600">Host / TV display</button>
  <div class="flex gap-2"><input id="roomInput" maxlength="4" class="uppercase min-w-0 w-full rounded-xl p-3" placeholder="ROOM"><button id="joinBtn" class="btn bg-indigo-600 hover:bg-indigo-500">Join</button></div>
 </div>
 <p id="setupError" class="text-rose-400 text-sm mt-3"></p>
</section>
<section id="game" class="hidden">
 <div class="flex flex-wrap justify-between items-center gap-3 mb-4">
  <div><div class="text-sm text-zinc-400">ROOM CODE</div><div id="roomCode" class="text-3xl font-black tracking-[.2em]">----</div></div>
  <div class="flex gap-2"><button id="copyLink" class="btn bg-zinc-800">Copy join link</button><button id="startBtn" class="btn bg-emerald-700 hidden">Start / Next hand</button></div>
 </div>
 <div id="qrWrap" class="hidden bg-white text-zinc-900 rounded-xl p-3 w-fit mb-4">
  <div class="font-bold text-sm mb-2">Scan to join</div><img id="qr" alt="QR code to join table" width="150" height="150"><div id="qrUrl" class="text-[10px] max-w-[150px] break-all mt-1"></div>
 </div>
 <div class="table-felt rounded-[38%] sm:rounded-[45%] min-h-[310px] sm:min-h-[420px] p-4 sm:p-8 flex flex-col items-center justify-center relative overflow-hidden">
  <div class="absolute top-4 text-emerald-100/80 text-xs sm:text-sm font-bold tracking-widest">HOLD’EM TABLE</div>
  <div class="flex items-center gap-3 mt-4 mb-3"><span class="text-emerald-100 text-xs uppercase">Pot</span><span id="pot" class="text-3xl sm:text-5xl font-black text-amber-300">0</span></div>
  <div id="community" class="flex gap-1.5 sm:gap-3 justify-center min-h-[100px] items-center"></div>
  <div id="streetLabel" class="text-emerald-100 text-xs mt-3 uppercase tracking-widest">Waiting for players</div>
  <div id="currentBet" class="text-emerald-50 text-sm mt-1">Current bet: 0</div>
 </div>
 <div id="message" class="text-center text-amber-300 font-bold my-4 min-h-6"></div>
 <div id="players" class="grid grid-cols-2 sm:grid-cols-4 gap-2 mb-5"></div>
 <section id="controller" class="hidden bg-zinc-900 border border-zinc-800 rounded-2xl p-4 sm:p-5">
  <div class="flex items-center justify-between gap-3 mb-3"><h2 class="font-black text-xl">Your hand</h2><div id="turnBadge" class="text-sm text-zinc-400">Waiting…</div></div>
  <div id="hole" class="flex gap-3 mb-4"></div>
  <div class="grid grid-cols-3 gap-2 mb-4 text-center">
   <div class="bg-zinc-800 rounded-xl p-3"><div class="text-xs text-zinc-400">Your stack</div><div id="myStack" class="font-black text-xl">0</div></div>
   <div class="bg-zinc-800 rounded-xl p-3"><div class="text-xs text-zinc-400">Committed</div><div id="myCommitted" class="font-black text-xl">0</div></div>
   <div class="bg-zinc-800 rounded-xl p-3"><div class="text-xs text-zinc-400">To call</div><div id="toCall" class="font-black text-xl">0</div></div>
  </div>
  <div id="actions" class="hidden">
   <div class="grid grid-cols-2 sm:grid-cols-4 gap-2 mb-3">
    <button data-action="fold" class="btn bg-rose-700">Fold</button><button id="checkCall" class="btn bg-emerald-700">Check</button><button id="raiseAction" class="btn bg-indigo-600">Raise</button><button data-action="all-in" class="btn bg-amber-600 text-zinc-950">All-In</button>
   </div>
   <div class="bg-zinc-800 rounded-xl p-3">
    <div class="flex justify-between text-sm mb-2"><label for="raiseSlider">Raise to</label><strong id="raiseValue">20</strong></div>
    <input id="raiseSlider" type="range" min="20" max="1000" value="40" class="w-full">
    <div class="grid grid-cols-3 gap-2 mt-3"><button data-preset="min" class="btn bg-zinc-700">Min</button><button data-preset="half" class="btn bg-zinc-700">Half pot</button><button data-preset="pot" class="btn bg-zinc-700">Pot</button></div>
   </div>
  </div>
 </section>
 <div id="toast" class="text-rose-400 text-sm text-center mt-3 min-h-5"></div>
</section>
</main>
<script>
const socket = io();
let roomCode = null, playerId = null, isHost = false, publicState = null, privateState = null;
const $ = id => document.getElementById(id);
const setupError = msg => $("setupError").textContent = msg || "";
const suitRed = s => s === "♥" || s === "♦";
function cardEl(c, hidden=false) {
 const el = document.createElement("div");
 if (hidden || !c) { el.className = "card back"; return el; }
 el.className = "card " + (suitRed(c.suit) ? "red" : "");
 const rank = c.rank === "T" ? "10" : c.rank;
 el.innerHTML = `<span>${rank}</span><span class="text-2xl self-center">${c.suit}</span><span class="self-end">${rank}</span>`;
 return el;
}
function showGame() {
 $("setup").classList.add("hidden"); $("game").classList.remove("hidden");
 $("roomCode").textContent = roomCode;
 const url = `${location.origin}${location.pathname}?room=${roomCode}`;
 $("qrUrl").textContent = url;
 $("qr").src = `https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${encodeURIComponent(url)}`;
 $("qrWrap").classList.toggle("hidden", !isHost);
 $("startBtn").classList.toggle("hidden", !isHost);
 $("controller").classList.toggle("hidden", isHost);
}
function toast(msg) { $("toast").textContent = msg || ""; }
function act(action, amount) { if (roomCode) socket.emit("player-action", { roomCode, action, amount }); }
$("hostBtn").onclick = () => {
 setupError("");
 socket.emit("create-room", {name: $("name").value || "Host"}, res => {
  if (!res?.ok) return setupError("Could not create room.");
  roomCode = res.roomCode; playerId = res.playerId; isHost = true; showGame();
 });
};
$("joinBtn").onclick = () => {
 setupError("");
 const code = $("roomInput").value.trim().toUpperCase();
 if (code.length !== 4) return setupError("Enter the 4-character room code.");
 socket.emit("join-room", {roomCode: code, name: $("name").value || "Player"}, res => {
  if (!res?.ok) return setupError(res?.error || "Could not join.");
  roomCode = res.roomCode; playerId = res.playerId; isHost = false; showGame();
 });
};
$("copyLink").onclick = async () => {
 const url = `${location.origin}${location.pathname}?room=${roomCode}`;
 try { await navigator.clipboard.writeText(url); $("copyLink").textContent = "Copied!"; }
 catch { prompt("Copy this join link:", url); }
};
$("startBtn").onclick = () => socket.emit("start-game", {roomCode});
$("community").replaceChildren(...Array.from({length:5},()=>cardEl(null,true)));
$("checkCall").onclick = () => act(privateState?.canCheck ? "check" : "call");
$("raiseAction").onclick = () => act("raise", Number($("raiseSlider").value));
document.querySelectorAll("[data-action]").forEach(b => b.onclick = () => act(b.dataset.action));
$("raiseSlider").oninput = () => $("raiseValue").textContent = $("raiseSlider").value;
document.querySelectorAll("[data-preset]").forEach(b => b.onclick = () => {
 if (!privateState) return;
 const min = Number($("raiseSlider").min), max = Number($("raiseSlider").max);
 let val = min;
 if (b.dataset.preset === "half") val = privateState.currentBet + Math.max(privateState.callAmount, Math.floor(privateState.pot/2));
 if (b.dataset.preset === "pot") val = privateState.currentBet + privateState.callAmount + privateState.pot;
 $("raiseSlider").value = Math.max(min, Math.min(max, val));
 $("raiseValue").textContent = $("raiseSlider").value;
});
socket.on("connect", () => $("connection").textContent = "Connected");
socket.on("disconnect", () => $("connection").textContent = "Reconnecting…");
socket.on("update-tv", state => {
 if (roomCode && state.code !== roomCode) return;
 publicState = state;
 if (!roomCode) {
  const wanted = new URLSearchParams(location.search).get("room");
  if (wanted && wanted.toUpperCase() === state.code) return;
 }
 $("pot").textContent = state.pot;
 $("currentBet").textContent = `Current bet: ${state.currentBet}`;
 $("streetLabel").textContent = state.street.toUpperCase();
 $("message").textContent = state.message || "";
 const community = state.community || [];
 $("community").replaceChildren(...Array.from({length:5},(_,i)=>community[i] ? cardEl(community[i]) : cardEl(null,true)));
 $("players").replaceChildren(...state.players.map(p => {
  const seat = document.createElement("div");
  seat.className = "seat " + (p.isTurn ? "playing-pulse border-amber-300" : "");
  const status = p.folded ? "FOLDED" : p.allIn ? "ALL-IN" : !p.connected ? "DISCONNECTED" : p.isTurn ? "YOUR TURN" : "ACTIVE";
  seat.innerHTML = `<div class="font-bold truncate">${p.isDealer ? "🔘 " : ""}${escapeHtml(p.name)}</div><div class="text-emerald-300 font-black">${p.stack} chips</div><div class="text-xs ${p.folded ? "text-rose-400" : p.allIn ? "text-amber-300" : "text-zinc-400"}">${status}</div><div class="text-xs text-zinc-400">Bet ${p.roundBet}</div>`;
  return seat;
 }));
 if (isHost) $("startBtn").textContent = state.status === "complete" ? "Deal next hand" : state.status === "playing" ? "Hand in progress" : "Start hand";
 $("startBtn").disabled = state.status === "playing" || state.players.length < 2;
 $("startBtn").classList.toggle("opacity-40", $("startBtn").disabled);
});
socket.on("update-player", state => {
 if (roomCode && state.roomCode !== roomCode) return;
 if (state.playerId !== playerId) return;
 privateState = state;
 $("myStack").textContent = state.stack;
 $("myCommitted").textContent = state.committed;
 $("toCall").textContent = state.callAmount;
 $("hole").replaceChildren(...(state.hole || []).map(c => cardEl(c)));
 $("turnBadge").textContent = state.isTurn ? "YOUR TURN" : state.status === "playing" ? "Waiting for action" : state.status.toUpperCase();
 $("turnBadge").className = "text-sm " + (state.isTurn ? "text-amber-300 font-black playing-pulse rounded-lg p-2" : "text-zinc-400");
 $("actions").classList.toggle("hidden", !(state.status === "playing" && state.isTurn));
 $("checkCall").textContent = state.canCheck ? "Check" : `Call ${state.callAmount}`;
 const max = Math.max(1, state.maxRaiseTo), min = Math.min(max, Math.max(1, state.minRaiseTo));
 $("raiseSlider").min = min; $("raiseSlider").max = max;
 $("raiseSlider").value = Math.max(min, Math.min(max, Number($("raiseSlider").value) || min));
 $("raiseValue").textContent = $("raiseSlider").value;
 if (state.isTurn && navigator.vibrate) navigator.vibrate([80,40,80]);
});
socket.on("action-error", msg => toast(msg));
function escapeHtml(s) { return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
const initialRoom = new URLSearchParams(location.search).get("room");
if (initialRoom) $("roomInput").value = initialRoom.toUpperCase();
</script>
</body></html>
